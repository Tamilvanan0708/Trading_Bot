services:
  xauusd-agent:
    build: .
    container_name: xauusd-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Single worker required (SQLite single-writer + single scheduler)
      - DATABASE_URL=sqlite+aiosqlite:///./data/xauusd_agent.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
