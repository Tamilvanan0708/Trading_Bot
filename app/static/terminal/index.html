<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>XAU AI — Signal Intelligence Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/terminal/static/css/terminal.css">
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<div class="app-shell">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">XAU</div>
      <div class="brand-text">
        <div class="brand-name">XAU AI</div>
        <div class="brand-sub">SIGNAL INTELLIGENCE</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="nav-section-label">MAIN</div>
      <a href="#/overview" data-route="/overview" class="nav-item"><span class="nav-ico">◈</span><span class="nav-label">Command Center</span></a>
      <a href="#/live" data-route="/live" class="nav-item"><span class="nav-ico">〽</span><span class="nav-label">Live Market</span></a>
      <a href="#/signals" data-route="/signals" class="nav-item"><span class="nav-ico">⚡</span><span class="nav-label">Signals Feed</span></a>
      <a href="#/paper" data-route="/paper" class="nav-item"><span class="nav-ico">💼</span><span class="nav-label">Paper Trading</span></a>
      
      <div class="nav-section-label">MY STRATEGIES</div>
      <a href="#/smc-fib" data-route="/smc-fib" class="nav-item"><span class="nav-ico">💎</span><span class="nav-label">SMC With Fib</span></a>
      <a href="#/fib-retracement" data-route="/fib-retracement" class="nav-item"><span class="nav-ico">🎯</span><span class="nav-label">Fib With Retracement</span></a>

      <div class="nav-section-label">SYSTEM</div>
      <a href="#/health" data-route="/health" class="nav-item"><span class="nav-ico">♥</span><span class="nav-label">System Health</span></a>
      <a href="#/settings" data-route="/settings" class="nav-item"><span class="nav-ico">⚙</span><span class="nav-label">Settings</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="sys-line"><span class="dot dot-green" id="sidebar-sys"></span><span id="sidebar-sys-label">connecting…</span></div>
      <div class="sys-line small muted" id="sidebar-version">v1.0.0</div>
    </div>
  </aside>

  <!-- ===================== MAIN COLUMN ===================== -->
  <div class="main-column">
    <!-- ===================== TOPBAR ===================== -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
        <div class="ticker">
          <div class="ticker-symbol">XAU/USD</div>
          <span class="live-pill" id="live-pill"><span class="dot dot-green"></span>LIVE</span>
        </div>
        <div class="price-block">
          <span class="price-main" id="top-price">—</span>
          <span class="price-change" id="top-change">—</span>
        </div>
        <div class="quote-mini muted" id="top-quote">bid — / ask —</div>
      </div>
      <div class="topbar-center" id="top-center">
        <span class="chip" id="chip-regime">regime —</span>
        <span class="chip" id="chip-session">session —</span>
        <span class="chip" id="chip-candle">candle —</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-sm" id="btn-live-refresh" style="padding:4px 10px;font-size:11px;background:rgba(34,197,94,0.12);border:1px solid #22c55e;color:#22c55e;font-weight:700;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-right:6px;" title="Click to toggle live auto-refresh speed (2s / 5s / OFF)">
          <span class="dot dot-green" style="animation:pulse 1.5s infinite;margin:0"></span>
          <span id="refresh-speed-label">⚡ 2s AUTO</span>
        </button>
        <span class="conn" id="conn-binance" title="Binance"><span class="dot dot-muted"></span>BINANCE</span>
        <span class="conn" id="conn-db" title="Database"><span class="dot dot-muted"></span>DB</span>
        <span class="conn" id="conn-sched" title="Scheduler"><span class="dot dot-muted"></span>SCHED</span>
        <span class="conn" id="conn-tg" title="Telegram"><span class="dot dot-muted"></span>TG</span>
        <span class="conn" id="conn-dq" title="Data quality"><span class="dot dot-muted"></span>DQ</span>
        <button class="icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications">🔔</button>
        <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
        <button class="icon-btn" id="theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle Light / Dark Theme" style="font-size:14px">🌙</button>
        <div class="avatar">Q</div>
      </div>
    </header>

    <!-- ===================== PAGE MOUNT ===================== -->
    <main class="content" id="view-mount" aria-live="polite">
      <!-- views rendered here -->
    </main>

    <!-- ===================== SIGNAL DRAWER ===================== -->
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Signal detail" hidden>
      <div class="drawer-head">
        <span>SIGNAL DETAIL</span>
        <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- ===================== TOASTS ===================== -->
    <div class="toast-stack" id="toast-stack" aria-live="assertive"></div>
  </div>
</div>

<!-- ===================== SCRIPTS ===================== -->
<script src="/terminal/static/js/lightweight-charts.js"></script>
<script src="/terminal/static/js/api.js"></script>
<script src="/terminal/static/js/ui.js"></script>
<script src="/terminal/static/js/charts.js"></script>
<script src="/terminal/static/js/app.js"></script>
</body>
</html>
