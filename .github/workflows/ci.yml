name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Ruff is included in CI.  The codebase carries a small number of
      # pre-existing style nits (unused vars in tests, try/except-pass), so
      # lint is reported but not a hard gate.  pytest is the hard gate.
      - name: Lint (ruff, advisory)
        run: ruff check app scripts tests || true

      - name: Run tests
        run: pytest -v --tb=short

      - name: Import smoke
        run: python -c "import app.api.app; import app.research.replay_engine; import app.research.outcome_tracker; print('imports OK')"
